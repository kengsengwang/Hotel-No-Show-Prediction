name: Hotel No-Show Prediction CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Robustly locate a CSV in /data
      - name: Find data file
        id: find_csv
        run: |
          set -e
          FILE="$(find data -type f -name '*.csv' | head -n1 || true)"
          if [ -n "$FILE" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=$FILE" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline (only if data exists)
        if: steps.find_csv.outputs.found == 'true'
        run: |
          python -m src.main --data "${{ steps.find_csv.outputs.path }}" --results results
