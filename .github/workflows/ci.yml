name: Hotel No-Show Prediction CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pipeline (only if data exists)
        if: ${{ hashFiles('data/**/*.csv') != '' }}
        run: |
          python -m src.main --data "$(git ls-files data/**/*.csv | head -n1)" --results results
